spring:
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER}
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console でアクセス可能
mybatis:
  type-handlers-package: com.inkblogdb.ddd.infrastructure.database.handler
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret-key: ${JWT_SECRET_KEY}
